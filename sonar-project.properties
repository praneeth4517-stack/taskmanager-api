# sonar-project.properties
# Fill in <your_project_key> and <your_organization_name> after you create the
# project on SonarCloud.io - see the setup steps for the Code Quality stage.

sonar.projectKey=<your_project_key>
sonar.organization=<your_organization_name>
sonar.host.url=https://sonarcloud.io
sonar.login=${SONAR_TOKEN}

sonar.sources=src
sonar.tests=test
sonar.exclusions=node_modules/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.projectName=TaskManager API
sonar.sourceEncoding=UTF-8

# Quality gate: fail the Jenkins stage if this comes back anything other than OK
sonar.qualitygate.wait=true
